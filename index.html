<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Searchbook</title>
<style>
:root { --primary: #6c5ce7; --primary-dark: #5b4bcf; --accent: #00b894; --danger: #e17055; --warning: #fdcb6e; --bg: #f8f9fe; --white: #ffffff; --text: #2d3436; --muted: #95a5a6; --border: #eef0f6; --shadow-sm: 0 2px 8px rgba(108,92,231,0.06); --shadow-md: 0 4px 16px rgba(108,92,231,0.10); --shadow-lg: 0 8px 32px rgba(108,92,231,0.15); --radius: 16px; --radius-sm: 10px; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; transition: 0.3s; }
body.dark { --bg: #0f0e17; --white: #1a1a2e; --text: #fffffe; --muted: #a7a9be; --border: #2a2a40; }
body.dark input, body.dark textarea { background: #2a2a40; color: var(--text); border-color: var(--border); }
body.dark .post-item, body.dark .chat-room-item, body.dark .search-result { background: #1a1a2e; }
#auth-app { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); padding: 20px; }
.auth-box { background: var(--white); padding: 40px 35px; border-radius: 24px; box-shadow: var(--shadow-lg); width: 100%; max-width: 420px; }
.auth-logo { font-size: 38px; font-weight: 900; background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 8px; cursor: pointer; user-select: none; }
.auth-subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 30px; }
.card { display: none; }
.card.active { display: block; }
.input-group { margin-bottom: 16px; }
.input-group input, .input-group textarea { width: 100%; padding: 14px 16px; font-size: 15px; border: 2px solid var(--border); border-radius: var(--radius-sm); outline: none; font-family: inherit; background: #fafbff; color: var(--text); }
.input-group input:focus, .input-group textarea:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
.password-wrapper { position: relative; }
.password-wrapper input { padding-right: 48px; }
.password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.password-toggle:hover { background: var(--bg); color: var(--primary); }
.btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: var(--radius-sm); cursor: pointer; margin-top: 8px; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn-green { background: linear-gradient(135deg, #00b894, #00cec9); }
.btn-red { background: linear-gradient(135deg, #e17055, #d63031); }
.btn-orange { background: linear-gradient(135deg, #f39c12, #e67e22); }
.link { color: var(--primary); font-size: 14px; text-align: center; display: block; margin-top: 14px; cursor: pointer; font-weight: 500; }
.divider { border-bottom: 1px solid var(--border); margin: 20px 0; }
h2 { text-align: center; margin-bottom: 20px; font-size: 22px; color: var(--text); font-weight: 700; }
.timer { text-align: center; color: var(--danger); font-weight: 700; padding: 12px; background: #fff5f5; border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 14px; }
.otp-display { text-align: center; font-size: 32px; color: var(--primary); font-weight: 900; letter-spacing: 12px; background: #f0f0ff; padding: 20px; border-radius: var(--radius-sm); border: 2px dashed var(--primary); margin-bottom: 15px; font-family: 'Courier New', monospace; }

/* ===== PASSWORD STRENGTH METER ===== */
.pwd-strength-box { margin-top: -8px; margin-bottom: 16px; padding: 12px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.pwd-strength-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.pwd-strength-fill { height: 100%; width: 0%; transition: 0.3s; border-radius: 4px; }
.pwd-strength-label { font-size: 12px; font-weight: 700; }
.pwd-requirements { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.7; }
.pwd-req-item { display: flex; align-items: center; gap: 6px; }
.pwd-req-item.ok { color: #00b894; font-weight: 700; }
.pwd-req-item.fail { color: #e17055; }

#main-app { display: none; }
#main-app.active { display: block; }
.top-bar { background: var(--white); padding: 12px 20px; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
.top-logo { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.top-icons { display: flex; gap: 8px; }
.top-icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
.top-icon-btn:hover { background: var(--primary); color: white; }
.notif-badge { position: absolute; top: -4px; right: -4px; background: #e17055; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
.layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; padding: 20px; }
.sidebar { width: 240px; background: var(--white); padding: 20px 15px; border-radius: var(--radius); box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 90px; display: none; }
@media (min-width: 900px) { .sidebar { display: block; } }
.sidebar-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; color: var(--text); margin-bottom: 4px; font-size: 15px; }
.sidebar-item:hover { background: #f0f0ff; color: var(--primary); }
.sidebar-item .icon { font-size: 20px; width: 26px; text-align: center; }
.main-content { flex: 1; max-width: 620px; margin: 0 auto; }
.main-view { display: none; }
.main-view.active { display: block; }
.right-sidebar { width: 260px; background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 90px; display: none; }
@media (min-width: 1100px) { .right-sidebar { display: block; } }
.right-sidebar h4 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
.right-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-sm); font-size: 14px; }
.right-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.post-box { background: var(--white); padding: 20px; border-radius: var(--radius); margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.post-box textarea { width: 100%; padding: 16px; font-size: 15px; border: 2px solid var(--border); border-radius: var(--radius-sm); outline: none; resize: none; min-height: 80px; font-family: inherit; background: #fafbff; }
.post-box textarea:focus { border-color: var(--primary); background: var(--white); }
.media-btns { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.media-btn { flex: 1; padding: 10px; border: none; border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; font-size: 14px; color: var(--text); font-weight: 600; min-width: 80px; }
.media-btn:hover { background: #f0f0ff; color: var(--primary); }
.post-item { background: var(--white); padding: 20px; border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); position: relative; }
.post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post-header .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
.post-header .info { flex: 1; }
.post-user { color: var(--text); font-weight: 700; font-size: 15px; cursor: pointer; }
.post-user:hover { color: var(--primary); }
.post-time { color: var(--muted); font-size: 12px; margin-top: 2px; }
.post-content { margin-top: 8px; font-size: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
.post-media { max-width: 100%; border-radius: var(--radius-sm); margin-top: 12px; }
.reactions-bar { display: flex; gap: 6px; margin-top: 12px; padding: 8px; background: var(--bg); border-radius: var(--radius-sm); }
.reaction-btn { flex: 1; background: transparent; border: none; cursor: pointer; font-size: 20px; padding: 6px; border-radius: 50%; }
.reaction-btn:hover { transform: scale(1.3); background: rgba(108,92,231,0.1); }
.reaction-btn.active { background: rgba(108,92,231,0.2); }
.post-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.action-btn { flex: 1; padding: 10px; background: transparent; border: none; cursor: pointer; color: var(--muted); font-weight: 600; border-radius: var(--radius-sm); font-size: 13px; }
.action-btn:hover { background: var(--bg); color: var(--primary); }
.action-btn.liked { color: var(--primary); background: rgba(108,92,231,0.1); }
.action-btn.bookmarked { color: var(--warning); background: rgba(253,203,110,0.15); }
.poll-box { margin-top: 12px; padding: 16px; background: #fafbff; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.poll-question { font-weight: 700; margin-bottom: 14px; font-size: 15px; }
.poll-option { padding: 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; position: relative; overflow: hidden; background: var(--white); }
.poll-option:hover { border-color: var(--primary); }
.poll-option.voted { border-color: var(--primary); }
.poll-option-fill { position: absolute; top: 0; left: 0; height: 100%; background: rgba(108,92,231,0.2); z-index: 0; }
.poll-option-text { position: relative; z-index: 1; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
.poll-total { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
.poll-creator { margin-top: 10px; padding: 14px; background: var(--bg); border-radius: var(--radius-sm); display: none; }
.poll-creator input { margin-bottom: 8px; padding: 10px; border: 2px solid var(--border); border-radius: 8px; background: var(--white); width: 100%; }
.poll-creator-btn { padding: 10px; font-size: 13px; margin-top: 6px; }
.active-counter { background: #e8f8f5; color: #00b894; padding: 12px 16px; border-radius: var(--radius-sm); text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
.stories-bar { display: flex; gap: 12px; overflow-x: auto; padding: 16px; background: var(--white); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.stories-bar::-webkit-scrollbar { height: 0; }
.story-item { flex-shrink: 0; text-align: center; cursor: pointer; }
.story-ring { width: 68px; height: 68px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
.story-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--white); }
.story-name { font-size: 11px; color: var(--text); margin-top: 6px; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.add-story-btn { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; border: 3px solid var(--white); }
.search-result { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px; background: var(--white); border: 1px solid var(--border); }
.search-pic-wrapper { position: relative; }
.search-pic { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
.search-status { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--white); }
.search-status.online { background: var(--accent); }
.search-status.offline { background: var(--muted); }
.pic-circle-lg { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary); }
.pic-wrapper { position: relative; display: inline-block; }
.status-dot { position: absolute; bottom: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--white); }
.status-dot.online { background: var(--accent); }
.status-dot.offline { background: #333; }
.stat-row { display: flex; gap: 25px; justify-content: center; margin: 18px 0; padding: 16px; background: var(--bg); border-radius: var(--radius-sm); }
.stat-row > span { text-align: center; font-size: 13px; color: var(--muted); }
.stat-row b { display: block; font-size: 20px; color: var(--text); margin-bottom: 4px; }
.chat-room-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px; background: var(--white); border: 1px solid var(--border); }
.chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
.chat-info { flex: 1; }
.chat-name { font-weight: 700; color: var(--text); margin-bottom: 4px; }
.chat-last { font-size: 13px; color: var(--muted); }
#chat-messages { max-height: 400px; overflow-y: auto; padding: 16px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 14px; }
.chat-msg { padding: 12px 16px; margin-bottom: 10px; border-radius: 20px; max-width: 75%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
.chat-msg.me { background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
.chat-msg.other { background: var(--white); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.chat-msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
.chat-input-row { display: flex; gap: 10px; }
.chat-input-row input { flex: 1; padding: 14px 18px; border: 2px solid var(--border); border-radius: 24px; outline: none; font-size: 15px; background: #fafbff; }
.chat-send-btn { background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; border: none; padding: 0 24px; border-radius: 24px; cursor: pointer; font-weight: 700; }
.center { text-align: center; }
.feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.small-btn { padding: 10px 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; font-size: 13px; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; }
.theme-toggle { position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: var(--shadow-lg); z-index: 999; display: none; }
.theme-toggle.show { display: block; }
#story-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; }
#story-viewer.active { display: flex; }
.story-viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; color: white; }
.story-viewer-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.story-viewer-media { max-width: 100%; max-height: 80vh; border-radius: 16px; }
.app-download-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 16px rgba(0,184,148,0.3); cursor: pointer; transition: 0.2s; font-family: inherit; text-decoration: none; }
.app-download-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,184,148,0.4); }
.complaint-box { background: #f0f0ff; padding: 14px; border-radius: var(--radius-sm); margin-top: 16px; border: 2px dashed var(--primary); cursor: pointer; text-align: center; }
.complaint-box:hover { background: #e8e8ff; }
.complaint-box-title { font-weight: 700; color: var(--primary); font-size: 14px; }
.complaint-box-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* 3-DOT POST MENU */
.post-menu-btn { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; z-index: 5; }
.post-menu-btn:hover { background: var(--bg); color: var(--primary); }
.post-menu-dropdown { position: absolute; top: 52px; right: 16px; background: var(--white); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 160px; z-index: 50; display: none; overflow: hidden; }
.post-menu-dropdown.show { display: block; }
.post-menu-item { padding: 12px 16px; font-size: 14px; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 8px; }
.post-menu-item:hover { background: var(--bg); color: var(--primary); }
.post-menu-item.danger { color: var(--danger); }
.post-menu-item.danger:hover { background: #fff5f5; }

/* DANGER ZONE */
.danger-zone { background: #fff5f5; border: 2px solid var(--danger); padding: 16px; border-radius: var(--radius-sm); margin-top: 14px; }
.danger-zone h4 { color: var(--danger); margin-bottom: 8px; font-size: 15px; }
.danger-zone p { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

/* USER DATA ANALYSIS */
.admin-user-card { cursor: pointer; transition: 0.2s; }
.admin-user-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
#user-analysis-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2100; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
#user-analysis-panel.active { display: flex; }
.analysis-box { background: var(--white); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 30px; }
.analysis-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.analysis-title { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.analysis-card { padding: 16px; background: var(--bg); border-radius: 12px; text-align: center; border: 2px solid var(--border); }
.analysis-card b { display: block; font-size: 24px; color: var(--primary); font-weight: 900; }
.analysis-card span { font-size: 12px; color: var(--muted); margin-top: 4px; display: block; }
.analysis-card.green b { color: #00b894; }
.analysis-card.red b { color: #e17055; }
.analysis-card.yellow b { color: #f39c12; }
.analysis-section { margin-bottom: 20px; padding: 16px; background: var(--bg); border-radius: 12px; }
.analysis-section h4 { margin-bottom: 12px; font-size: 15px; color: var(--text); border-left: 4px solid var(--primary); padding-left: 10px; }
.analysis-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--border); }
.analysis-row:last-child { border-bottom: none; }
.analysis-row span:first-child { color: var(--muted); }
.analysis-row span:last-child { font-weight: 700; color: var(--text); }
.activity-bar { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--white); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
.activity-bar .bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.activity-bar .bar-fill { height: 100%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); border-radius: 4px; }
.activity-bar .label { font-size: 12px; color: var(--muted); min-width: 90px; }
.activity-bar .value { font-size: 13px; font-weight: 700; color: var(--text); min-width: 40px; text-align: right; }

/* ===== NEW: RECOMMEND PANEL ===== */
#recommend-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2050; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
#recommend-panel.active { display: flex; }
.recommend-box { background: var(--white); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 30px; }
.recommend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.recommend-title { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #00b894, #00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.recommend-card { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
.recommend-card .pic { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
.recommend-card .info { flex: 1; }
.recommend-card .name { font-weight: 700; font-size: 15px; color: var(--text); }
.recommend-card .reason { font-size: 12px; color: var(--muted); margin-top: 3px; }
.recommend-card .score-badge { background: #00b894; color: white; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.recommend-follow-btn { padding: 8px 14px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
.recommend-follow-btn:hover { opacity: 0.9; }

/* ===== NEW: NOTIFICATION PANEL ===== */
#notif-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2050; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
#notif-panel.active { display: flex; }
.notif-box { background: var(--white); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 30px; }
.notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.notif-title { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #f39c12, #e67e22); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
.notif-item.priority-high { border-left-color: #e17055; background: #fff5f5; }
.notif-item.priority-medium { border-left-color: #f39c12; background: #fffbf0; }
.notif-item.priority-low { border-left-color: #00b894; background: #f0fdf4; }
.notif-icon { font-size: 24px; flex-shrink: 0; }
.notif-content { flex: 1; }
.notif-text { font-size: 14px; color: var(--text); margin-bottom: 4px; }
.notif-time { font-size: 11px; color: var(--muted); }
.notif-score { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--white); padding: 2px 6px; border-radius: 6px; }

/* SPAM WARNING */
.spam-warning { background: #fff5f5; border: 2px solid #e17055; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; color: #e17055; font-weight: 600; }

/* FAKE ACCOUNT FLAG */
.fake-flag { background: #f39c12; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }

/* ADMIN PANEL */
#admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
#admin-panel.active { display: flex; }
.admin-box { background: var(--white); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 1100px; max-height: 92vh; overflow-y: auto; padding: 30px; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
.admin-title { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #e17055, #d63031); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.admin-close { width: 40px; height: 40px; border-radius: 50%; border: none; background: #e17055; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.admin-close:hover { background: #d63031; }
.admin-stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.admin-stat { flex: 1; min-width: 110px; padding: 16px; background: var(--bg); border-radius: 12px; text-align: center; }
.admin-stat b { display: block; font-size: 26px; color: var(--primary); }
.admin-stat span { font-size: 12px; color: var(--muted); }
.admin-user-list { display: flex; flex-direction: column; gap: 10px; }
.admin-user-card { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--bg); border-radius: 12px; border: 2px solid var(--border); flex-wrap: wrap; }
.admin-user-card.blocked { border-color: #e17055; background: #fff5f5; }
.admin-user-card.suspended { border-color: #fdcb6e; background: #fffbf0; }
.admin-user-card.muted { border-color: #a29bfe; background: #f5f3ff; }
.admin-user-card.online { border-color: #00b894; }
.admin-user-card.flagged { border-color: #f39c12; background: #fffbf0; }
.admin-user-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; position: relative; }
.admin-user-avatar .online-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--white); background: #00b894; }
.admin-user-info { flex: 1; min-width: 180px; }
.admin-user-info .name { font-weight: 700; color: var(--text); font-size: 15px; }
.admin-user-info .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.admin-user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.admin-btn { padding: 7px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 700; color: white; }
.admin-btn.block { background: #e17055; }
.admin-btn.unblock { background: #00b894; }
.admin-btn.suspend { background: #fdcb6e; color: #2d3436; }
.admin-btn.unsuspend { background: #00cec9; }
.admin-btn.mute { background: #a29bfe; }
.admin-btn.warn { background: #f39c12; }
.admin-btn.strike { background: #d63031; }
.admin-btn.delete { background: #c0392b; }
.admin-btn.reset2fa { background: #3498db; }
.admin-btn.analyze { background: #6c5ce7; }
.admin-btn:hover { opacity: 0.85; }
.admin-login-form { max-width: 350px; margin: 40px auto; text-align: center; }
.admin-login-form h2 { color: #e17055; margin-bottom: 20px; }
.admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.admin-tab { padding: 10px 20px; border: none; border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 700; cursor: pointer; font-size: 14px; }
.admin-tab.active { background: linear-gradient(135deg,#e17055,#d63031); color: white; }
.complaint-card { display: flex; flex-direction: column; gap: 8px; padding: 15px; background: var(--bg); border-radius: 12px; border: 2px solid var(--border); margin-bottom: 10px; }
.complaint-card.resolved { border-color: #00b894; background: #f0fdf4; }
.complaint-card.pending { border-color: #f39c12; background: #fffbf0; }
.complaint-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.complaint-user { font-weight: 700; color: var(--primary); }
.complaint-status { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.complaint-status.pending { background: #f39c12; color: white; }
.complaint-status.resolved { background: #00b894; color: white; }
.complaint-subject { font-weight: 700; color: var(--text); font-size: 15px; }
.complaint-message { color: var(--text); font-size: 14px; line-height: 1.5; }
.complaint-time { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>

<div id="auth-app">
    <div class="auth-box">
        <h1 class="auth-logo" id="auth-logo">Searchbook</h1>
        <p class="auth-subtitle">Connect with friends, share your moments</p>

        <div id="login-panel" class="card active">
            <div class="input-group"><input type="email" id="login-email" placeholder="Email address"></div>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Password">
                    <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)">👁️</button>
                </div>
            </div>
            <button class="btn" onclick="handleLogin()">Log In</button>

            <button class="btn btn-green" onclick="switchPanel('register-panel')">Create New Account</button>
            <div style="margin-top:16px;text-align:center;">
                <a href="https://github.com/grandrpserver31-wq/searchbook-backend/releases/download/v1.0.0/Searchbook-APK.zip" download class="app-download-btn">📱 Download Android App</a>
                <p style="font-size:11px;color:var(--muted);margin-top:8px;">Get Searchbook on your phone</p>
            </div>
            <div class="complaint-box" onclick="switchPanel('complaint-panel')">
                <div class="complaint-box-title">📢 Complaint Box</div>
                <div class="complaint-box-sub">Kono somossa? Admin ke janan</div>
            </div>
        </div>

        <div id="register-panel" class="card">
            <h2>Create Account</h2>
        </div>
    </div>
</div>
