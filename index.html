<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searchbook Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body { background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); margin-bottom: 20px; }
        h1 { color: #6c5ce7; text-align: center; margin-bottom: 20px; font-size: 26px; }
        .login-form input { width: 100%; padding: 14px; border: 2px solid #eef0f6; border-radius: 10px; font-size: 15px; margin-bottom: 10px; outline: none; }
        .login-form input:focus { border-color: #6c5ce7; }
        button { padding: 12px 24px; background: #6c5ce7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin: 4px; }
        button:hover { background: #5b4bcf; }
        .btn-red { background: #e74c3c; } .btn-red:hover { background: #c0392b; }
        .btn-orange { background: #f39c12; } .btn-orange:hover { background: #e67e22; }
        .btn-gray { background: #95a5a6; } .btn-gray:hover { background: #7f8c8d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eef0f6; font-size: 13px; }
        th { background: #6c5ce7; color: white; }
        tr:hover { background: #f8f9fe; }
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #d4edda; color: #155724; }
        .badge-red { background: #f8d7da; color: #721c24; }
        .badge-gray { background: #e2e3e5; color: #383d41; }
        .badge-orange { background: #fff3cd; color: #856404; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { flex: 1; min-width: 130px; padding: 20px; background: #f8f9fe; border-radius: 12px; text-align: center; border: 1px solid #eef0f6; }
        .stat-box h3 { color: #6c5ce7; font-size: 30px; }
        .stat-box p { color: #95a5a6; font-size: 13px; margin-top: 5px; }
        .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .small-btn { padding: 6px 10px; font-size: 11px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="login-card">
            <h1>🔐 Searchbook Admin Panel</h1>
            <div class="login-form">
                <input type="text" id="admin-user" placeholder="Admin Username">
                <input type="password" id="admin-pass" placeholder="Admin Password">
                <button onclick="loginAdmin()">🚀 Login as Admin</button>
            </div>
        </div>

        <div id="admin-panel" style="display: none;">
            <div class="card">
                <h1>👑 Admin Dashboard</h1>
                <button class="btn-gray" onclick="loadUsers()">🔄 Refresh Users</button>
                <button class="btn-red" onclick="logoutAdmin()">🚪 Logout</button>
                <div id="stats" class="stats"></div>
            </div>
            <div class="card">
                <h2 style="margin-bottom: 15px; color: #6c5ce7;">👥 All Users</h2>
                <div id="users-table"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://searchbook-backend.onrender.com";
        let ADMIN_USER = "";
        let ADMIN_PASS = "";

        function loginAdmin() {
            ADMIN_USER = document.getElementById('admin-user').value.trim();
            ADMIN_PASS = document.getElementById('admin-pass').value.trim();
            
            if (!ADMIN_USER || !ADMIN_PASS) {
                alert("Username + Password din");
                return;
            }
            
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadUsers();
        }

        function logoutAdmin() {
            ADMIN_USER = "";
            ADMIN_PASS = "";
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
        }

        async function loadUsers() {
            const table = document.getElementById('users-table');
            table.innerHTML = '⏳ Loading...';

            try {
                const res = await fetch(BACKEND_URL + '/api/admin/users', {
                    headers: {
                        'x-admin-user': ADMIN_USER,
                        'x-admin-pass': ADMIN_PASS
                    }
                });
                const data = await res.json();

                if (!data.success) {
                    table.innerHTML = '<p style="color: red;">❌ ' + data.message + '</p>';
                    return;
                }

                // Stats
                const totalUsers = data.count;
                const blockedUsers = data.users.filter(u => u.blocked).length;
                const activeUsers = data.users.filter(u => u.isActive).length;
                const twoFAUsers = data.users.filter(u => u.twoFAEnabled).length;

                document.getElementById('stats').innerHTML = `
                    <div class="stat-box"><h3>${totalUsers}</h3><p>Total Users</p></div>
                    <div class="stat-box"><h3>${activeUsers}</h3><p>Active Now</p></div>
                    <div class="stat-box"><h3>${blockedUsers}</h3><p>Blocked</p></div>
                    <div class="stat-box"><h3>${twoFAUsers}</h3><p>2FA Enabled</p></div>
                `;

                // Table
                if (data.users.length === 0) {
                    table.innerHTML = '<p style="text-align: center; color: #95a5a6;">No users yet</p>';
                    return;
                }

                let html = '<table><tr><th>#</th><th>Username</th><th>Email</th><th>Status</th><th>2FA</th><th>Strikes</th><th>Action</th></tr>';
                data.users.forEach((u, i) => {
                    html += '<tr>';
                    html += '<td>' + (i+1) + '</td>';
                    html += '<td><b>' + escapeHtml(u.username) + '</b><br><small>' + escapeHtml(u.fullName || '') + '</small></td>';
                    html += '<td>' + escapeHtml(u.email) + '</td>';
                    html += '<td>' + (u.isActive ? '<span class="badge badge-green">🟢 Active</span>' : '<span class="badge badge-gray">⚫ Offline</span>') + '</td>';
                    html += '<td>' + (u.twoFAEnabled ? '<span class="badge badge-green">ON</span>' : '<span class="badge badge-gray">OFF</span>') + '</td>';
                    html += '<td><span class="badge badge-orange">' + (u.strikeCount || 0) + '</span></td>';
                    html += '<td class="action-btns">';
                    
                    if (u.blocked) {
                        html += '<button class="small-btn" style="background:#42b72a;" onclick="toggleBlock(\'' + escapeHtml(u.username) + '\', false)">Unblock</button>';
                    } else {
                        html += '<button class="small-btn btn-orange" onclick="toggleBlock(\'' + escapeHtml(u.username) + '\', true)">Block</button>';
                    }
                    
                    html += '<button class="small-btn btn-orange" onclick="addStrike(\'' + escapeHtml(u.username) + '\')">Strike</button>';
                    html += '<button class="small-btn" onclick="sendMessage(\'' + escapeHtml(u.username) + '\')">Message</button>';
                    html += '<button class="small-btn btn-red" onclick="deleteUser(\'' + escapeHtml(u.username) + '\')">Delete</button>';
                    html += '</td>';
                    html += '</tr>';
                });
                html += '</table>';
                table.innerHTML = html;

            } catch (e) {
                table.innerHTML = '<p style="color: red;">❌ Error: ' + e.message + '</p>';
            }
        }

        async function toggleBlock(username, block) {
            const action = block ? "block" : "unblock";
            if (!confirm("Ei user ke " + action + " korte chan?")) return;

            try {
                const res = await fetch(BACKEND_URL + '/api/admin/block', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-user': ADMIN_USER,
                        'x-admin-pass': ADMIN_PASS
                    },
                    body: JSON.stringify({ username, block })
                });
                const data = await res.json();
                if (data.success) { alert("✅ " + data.message); loadUsers(); }
                else alert("❌ " + data.message);
            } catch (e) { alert("❌ Error: " + e.message); }
        }

        async function addStrike(username) {
            const reason = prompt("Strike reason (ki bhul korche?):");
            if (!reason) return;

            try {
                const res = await fetch(BACKEND_URL + '/api/admin/strike', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-user': ADMIN_USER,
                        'x-admin-pass': ADMIN_PASS
                    },
                    body: JSON.stringify({ username, reason })
                });
                const data = await res.json();
                if (data.success) {
                    alert("✅ " + data.message + (data.blocked ? "\n⚠️ 3 strike - User auto blocked!" : ""));
                    loadUsers();
                } else alert("❌ " + data.message);
            } catch (e) { alert("❌ Error: " + e.message); }
        }

        async function sendMessage(username) {
            const message = prompt("User ke ki message pathate chan?");
            if (!message) return;

            try {
                const res = await fetch(BACKEND_URL + '/api/admin/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-user': ADMIN_USER,
                        'x-admin-pass': ADMIN_PASS
                    },
                    body: JSON.stringify({ username, message })
                });
                const data = await res.json();
                if (data.success) alert("✅ Message sent!");
                else alert("❌ " + data.message);
            } catch (e) { alert("❌ Error: " + e.message); }
        }

        async function deleteUser(username) {
            if (!confirm("⚠️ Ei user ke PERMANENTLY delete korte chan? (Post, chat, sob delete hobe)")) return;

            try {
                const res = await fetch(BACKEND_URL + '/api/admin/user/' + encodeURIComponent(username), {
                    method: 'DELETE',
                    headers: {
                        'x-admin-user': ADMIN_USER,
                        'x-admin-pass': ADMIN_PASS
                    }
                });
                const data = await res.json();
                if (data.success) { alert("✅ User deleted!"); loadUsers(); }
                else alert("❌ " + data.message);
            } catch (e) { alert("❌ Error: " + e.message); }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
